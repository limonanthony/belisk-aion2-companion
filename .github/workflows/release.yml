name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build, test and sign
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Decide whether this push is a release
        id: plan
        run: cargo xtask release-plan

      - name: Check the changelogs and write the release notes
        if: steps.plan.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: cargo xtask release-notes "$VERSION"

      - name: Test the workspace
        run: cargo test --workspace --locked

      - name: Build and package the release
        if: steps.plan.outputs.publish == 'true'
        env:
          UPDATE_REPO: ${{ github.repository }}
        run: cargo xtask dist

      - name: Write the signing key to a temporary file
        if: steps.plan.outputs.publish == 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.BELISK_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z ${UPDATE_SIGNING_KEY:-} ]]; then
            echo "::error::The repository secret BELISK_UPDATE_SIGNING_KEY is not set, so the update archive cannot be signed and nothing is published. See docs/releasing.md."
            exit 1
          fi
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/belisk-update-signing.key"

      - name: Sign the update archive
        if: steps.plan.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: cargo xtask sign --key "$RUNNER_TEMP/belisk-update-signing.key" "target/dist/belisk-$VERSION-windows-x64-update.zip"

      - name: Remove the signing key
        if: always() && steps.plan.outputs.publish == 'true'
        run: rm -f "$RUNNER_TEMP/belisk-update-signing.key"

      - name: Gather the release assets
        if: steps.plan.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          for asset in \
            "belisk-$VERSION-windows-x64.zip" \
            "belisk-$VERSION-windows-x64-update.zip" \
            "belisk-$VERSION-windows-x64-update.zip.sha256" \
            "belisk-$VERSION-windows-x64-update.zip.sig"; do
            cp "target/dist/$asset" target/release-assets/
          done
          ls -l target/release-assets

      - name: Hand the assets to the publish job
        if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: target/release-assets
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          options=()
          if [[ $PRERELEASE == true ]]; then
            options+=(--prerelease)
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Belisk $VERSION" \
            --notes-file release-assets/notes.md \
            --draft \
            "${options[@]}" \
            "release-assets/belisk-$VERSION-windows-x64.zip" \
            "release-assets/belisk-$VERSION-windows-x64-update.zip" \
            "release-assets/belisk-$VERSION-windows-x64-update.zip.sha256" \
            "release-assets/belisk-$VERSION-windows-x64-update.zip.sig"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
