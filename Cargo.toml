[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/xtask", "crates/packet-explorer"]

# Dependencies (GPUI, its layout, text and image crates) are optimized in dev
# and test builds; the workspace's own crates stay unoptimized for debugging.
# See docs/technical-notes.md, "Debug builds".
[profile.dev.package."*"]
opt-level = 2

# GPUI embeds its own asInvoker manifest through embed-resource, which collides
# with the app's requireAdministrator one (LNK1123). The patched copy skips
# the embedding for gpui-pre only; see docs/technical-notes.md, "Live capture and the manifest".
[patch.crates-io]
embed-resource = { path = "vendor/embed-resource" }
