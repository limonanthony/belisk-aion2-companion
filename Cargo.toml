[workspace]
resolver = "2"
members = ["crates/aether-core", "crates/app"]
# The Tauri app stays a separate package with its own lockfile and target dir.
exclude = ["src-tauri"]

# GPUI embeds its own asInvoker manifest through embed-resource, which collides
# with the app's requireAdministrator one (LNK1123). The patched copy skips
# the embedding for gpui-pre only; see docs/GPUI_MIGRATION.md, "Live capture and the manifest".
[patch.crates-io]
embed-resource = { path = "vendor/embed-resource" }
