[package]
name = "belisk"
version = "1.0.0"
license = "GPL-3.0-only"
description = "Belisk, a combat meter and companion for AION 2"
edition = "2021"

[lib]
name = "belisk"
path = "src/lib.rs"

[[bin]]
name = "belisk"
path = "src/main.rs"
test = false

[dependencies]
meter-core = { path = "../core" }
ed25519-dalek = "2"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
futures = "0.3"
global-hotkey = "0.7"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
i18n-embed = { version = "0.16.0", features = ["fluent-system"] }
i18n-embed-fl = "0.10.1"
rust-embed = { version = "8.12.0", features = ["debug-embed"] }
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Media_Audio",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Wdk_System_Threading",
    "Win32_System_Kernel",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

# GPUI is pinned to the exact snapshot (`gpui-pre =
# "=0.3.7"`) that GPUI Kit 0.7.0 pinned; the Kit is not used. Bump both
# crates together.
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7" }

[dev-dependencies]
fluent-syntax = "0.12"
parking_lot = "0.12"
# The Settings window's keyboard and focus tests drive the real view in
# GPUI's test platform.
gpui = { package = "gpui-pre", version = "=0.3.7", features = ["test-support"] }

[features]
# `--overlay-probe`, `--font-probe` and `--capture`: checks of the overlay
# window and of font selection, and off-screen captures of the meter
# (docs/technical-notes.md, "Checking without showing anything"). Not part of the shipped binary.
probes = [
    "dep:image",
    "windows/Win32_Graphics_Gdi",
    "windows/Win32_Storage_Xps",
    "windows/Win32_UI_HiDpi",
]

[build-dependencies]
embed-resource = "3"
