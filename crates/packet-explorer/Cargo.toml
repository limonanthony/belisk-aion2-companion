[package]
name = "packet-explorer"
version = "0.0.0"
license = "GPL-3.0-only"
description = "Developer-only explorer for Belisk recordings; not part of the app and never shipped"
edition = "2021"
publish = false

[dependencies]
meter-core = { path = "../core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
lz4_flex = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
